<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso | Mecánica Fácil</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Arial,sans-serif;background:#101827;color:#fff}
    main{width:min(100%,420px);padding:30px;border-radius:18px;background:#1e293b;
      text-align:center;box-shadow:0 12px 35px #0005}
    .mark{font-size:42px}
    h1{font-size:25px;margin:12px 0}
    p{line-height:1.5;color:#d1d5db}
    .status{margin:22px 0;padding:14px;border-radius:10px;background:#334155}
    .ok{color:#86efac}.no{color:#fca5a5}
    a{display:inline-block;margin-top:12px;padding:13px 20px;border-radius:9px;
      background:#2563eb;color:white;text-decoration:none;font-weight:bold}
    small{display:block;margin-top:20px;color:#94a3b8;line-height:1.4}
  </style>
</head>
<body>
<main>
  <div class="mark">🔐</div>
  <h1>Mecánica Fácil</h1>
  <p>Comprobando el modelo del dispositivo...</p>
  <div id="status" class="status">Verificando compatibilidad</div>
  <div id="action"></div>
  <small>Control de acceso académico. Esta comprobación del navegador es orientativa
    y no constituye una autenticación segura del dispositivo físico.</small>
</main>
<script>
(async () => {
  const allowedModel = /(?:ZTE[\s_-]*8550|8550)/i;
  const ua = navigator.userAgent || "";
  let model = "";

  // Algunos navegadores Android ofrecen el modelo mediante User-Agent Client Hints.
  try {
    if (navigator.userAgentData &&
        typeof navigator.userAgentData.getHighEntropyValues === "function") {
      const hints = await navigator.userAgentData.getHighEntropyValues(["model"]);
      model = hints.model || "";
    }
  } catch (_) {}

  // En otros navegadores Android el modelo puede aparecer en el User-Agent tradicional.
  const combined = model + " " + ua;
  const status = document.getElementById("status");
  const action = document.getElementById("action");

  if (allowedModel.test(combined)) {
    status.className = "status ok";
    status.textContent = "Modelo compatible detectado: ZTE Blade V50 Vita.";
    const link = document.createElement("a");
    link.href = "https://mecnicafcil.bubbleapps.io/version-test/";
    link.textContent = "Ingresar a Mecánica Fácil";
    action.appendChild(link);
  } else {
    status.className = "status no";
    status.textContent =
      "Acceso no permitido o modelo no identificable. Esta página está preparada para ZTE 8550.";
  }
})();
</script>
</body>
</html>
